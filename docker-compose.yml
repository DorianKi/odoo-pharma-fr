# Environnement local : Odoo 19 Community + PostgreSQL 16, modules montés depuis ce dépôt.
#   docker compose up -d      puis http://localhost:8069
# Créez une base (cochez « France »), puis Applications > « Pharmacie FR - Base produits ».
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    ports:
      # Accès SQL depuis le poste (DBeaver, psql, Python) : localhost:55432 par défaut.
      # Port peu courant pour éviter un PostgreSQL local ; modifiable : PG_PORT=xxxx docker compose up -d
      - "127.0.0.1:${PG_PORT:-55432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: unless-stopped

  adminer:
    # Interface web pour parcourir et interroger la base : http://localhost:8080
    # Système : PostgreSQL, serveur : db, utilisateur / mot de passe : odoo / odoo
    image: adminer
    depends_on:
      - db
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
    restart: unless-stopped

  odoo:
    image: odoo:19
    depends_on:
      - db
    ports:
      - "${ODOO_PORT:-8069}:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - ./:/mnt/extra-addons:ro
      - ./bdpm:/mnt/bdpm:ro
      - odoo-data:/var/lib/odoo
    restart: unless-stopped

volumes:
  pg-data:
  odoo-data:
