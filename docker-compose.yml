# Environnement local : Odoo 19 Community + PostgreSQL 16, modules montés depuis ce dépôt.
#   docker compose up -d      puis http://localhost:8069
# Créez une base (cochez « France »), puis Applications > « Pharmacie FR - Base produits ».
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    ports:
      # Port 5433 côté poste : le 5432 est souvent déjà pris par un PostgreSQL local.
      - "127.0.0.1:5433:5432"   # accès SQL : localhost:5433 (DBeaver, psql, Python)
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: unless-stopped

  adminer:
    # Interface web pour parcourir et interroger la base : http://localhost:8080
    # Système : PostgreSQL, serveur : db, utilisateur / mot de passe : odoo / odoo
    image: adminer
    depends_on:
      - db
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  odoo:
    image: odoo:19
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - ./:/mnt/extra-addons:ro
      - ./bdpm:/mnt/bdpm:ro
      - odoo-data:/var/lib/odoo
    restart: unless-stopped

volumes:
  pg-data:
  odoo-data:
